name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fandango29-site .

      - name: Run Docker container
        run: docker run -d --name fandango29-container -p 8080:80 fandango29-site

      - name: Check container
        run: docker ps

      - name: Test website
        run: |
          sleep 2
          curl --fail http://localhost:8080